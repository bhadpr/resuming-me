<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e8" />
    <meta name="description" content="Track what you postpone. Resume what matters." />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('resuming-theme')
          const allowed = ['resuming', 'nocturne', 'slate', 'dawn', 'fresh', 'vault']
          const retired = { modernist: 'dawn', broadsheet: 'dawn', sage: 'dawn', pulse: 'dawn' }
          const migrated =
            stored === 'pixloo'
              ? 'fresh'
              : stored && retired[stored]
                ? retired[stored]
                : stored
          const theme = allowed.includes(migrated) ? migrated : 'dawn'
          document.documentElement.setAttribute('data-theme', theme)
          const meta = document.querySelector('meta[name="theme-color"]')
          const colors = {
            resuming: '#faf6f0',
            nocturne: '#07070b',
            slate: '#0f1218',
            dawn: '#fff4e8',
            fresh: '#eef2f9',
            vault: '#0a0a0a',
          }
          if (meta) meta.setAttribute('content', colors[theme] || colors.dawn)
          document.documentElement.style.colorScheme =
            theme === 'nocturne' || theme === 'slate' || theme === 'vault' ? 'dark' : 'light'
        } catch (_) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Libre+Franklin:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Resuming</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e8" />
    <meta name="description" content="Track what you postpone. Resume what matters." />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('resuming-theme')
          const allowed = ['resuming', 'nocturne', 'slate', 'dawn', 'fresh', 'vault']
          const retired = { modernist: 'dawn', broadsheet: 'dawn', sage: 'dawn', pulse: 'dawn' }
          const migrated =
            stored === 'pixloo'
              ? 'fresh'
              : stored && retired[stored]
                ? retired[stored]
                : stored
          const theme = allowed.includes(migrated) ? migrated : 'dawn'
          document.documentElement.setAttribute('data-theme', theme)
          const meta = document.querySelector('meta[name="theme-color"]')
          const colors = {
            resuming: '#faf6f0',
            nocturne: '#07070b',
            slate: '#0f1218',
            dawn: '#fff4e8',
            fresh: '#eef2f9',
            vault: '#0a0a0a',
          }
          if (meta) meta.setAttribute('content', colors[theme] || colors.dawn)
          document.documentElement.style.colorScheme =
            theme === 'nocturne' || theme === 'slate' || theme === 'vault' ? 'dark' : 'light'

          // Non-default themes: inject Google Fonts ASAP (default dawn is self-hosted).
          if (theme !== 'dawn') {
            const hrefs = {
              resuming:
                'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap',
              nocturne:
                'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@500;600;700&display=swap',
              slate:
                'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap',
              fresh:
                'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap',
              vault:
                'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700;800&display=swap',
            }
            const pre1 = document.createElement('link')
            pre1.rel = 'preconnect'
            pre1.href = 'https://fonts.googleapis.com'
            pre1.setAttribute('data-resuming-fonts-preconnect', '1')
            document.head.appendChild(pre1)
            const pre2 = document.createElement('link')
            pre2.rel = 'preconnect'
            pre2.href = 'https://fonts.gstatic.com'
            pre2.crossOrigin = 'anonymous'
            pre2.setAttribute('data-resuming-fonts-preconnect', '1')
            document.head.appendChild(pre2)
            const link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = hrefs[theme]
            link.setAttribute('data-resuming-theme-fonts', theme)
            document.head.appendChild(link)
          }
        } catch (_) {}
      })()
    </script>
    <link
      rel="preload"
      href="/fonts/sourcesans3-nwpStKy2OAdR1K-IwhWudF-R3w8aZejf5Hc.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/sourceserif4-vEFF2_tTDB4M7-auWDN0ahZJW3IX2ih5nk3AucvUHf6kDXr4Y3qwzQ.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Resuming</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

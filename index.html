      content="A personal growth app for the habits you keep postponing. Start again when you drift."
    />
    <meta name="twitter:image" content="https://resuming.me/og.png" />
    <script>
      // Keep in sync with src/lib/themes.ts and src/lib/textSize.ts.
      (() => {
        try {
          const root = document.documentElement
          const stored = localStorage.getItem('resuming-theme')
          const retired = {
            modernist: 'dawn',
            broadsheet: 'dawn',
            sage: 'dawn',
            pulse: 'dawn',
            pixloo: 'dawn',
            fresh: 'dawn',
            nocturne: 'slate',
            vault: 'slate',
          }
          const colors = { dawn: '#fff4e8', resuming: '#faf6f0', slate: '#0f1218' }
          let theme = stored && retired[stored] ? retired[stored] : stored
          if (theme === 'system') {
            const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            theme = dark ? 'slate' : 'dawn'
          }
          if (!colors[theme]) theme = 'dawn'
          root.setAttribute('data-theme', theme)
          root.style.colorScheme = theme === 'slate' ? 'dark' : 'light'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', colors[theme])

          const sizes = { normal: '16px', large: '18px', xlarge: '20px' }
          const size = sizes[localStorage.getItem('resuming-text-size')]
          if (size) root.style.setProperty('--font-size-root', size)
        } catch (_) {}
      })()
    </script>
    <link
      rel="preload"
      href="/fonts/sourcesans3-nwpStKy2OAdR1K-IwhWudF-R3w8aZejf5Hc.woff2"

      crossorigin

  </body>

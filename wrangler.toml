# Cloudflare Pages / Workers static assets
# https://developers.cloudflare.com/workers/static-assets/routing/single-page-application/

name = "resuming-me"
compatibility_date = "2026-08-12"

# Runs only for /e/* (see run_worker_first). Everything else is served straight from ./dist.
main = "worker/index.ts"
# SUPABASE_URL and SUPABASE_ANON_KEY are set in the Cloudflare dashboard; keep them on deploy.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "drop-trailing-slash"
run_worker_first = ["/e/*"]

# Apex domain — Chrome flags resuming-me.pages.dev as a lookalike of resuming.me.
[[routes]]
pattern = "resuming.me"
custom_domain = true

[[routes]]
pattern = "www.resuming.me"
custom_domain = true

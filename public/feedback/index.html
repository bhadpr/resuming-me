<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Send feedback about Resuming." />
    <link rel="canonical" href="https://resuming.me/feedback" />
    <meta property="og:title" content="Feedback · Resuming" />
    <meta property="og:description" content="Send feedback about Resuming." />
    <meta property="og:url" content="https://resuming.me/feedback" />
    <meta property="og:image" content="https://resuming.me/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Feedback · Resuming</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff4e8;
        --text: #1a1614;
        --muted: #6b5e55;
        --accent: #e07a5f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      a { color: var(--accent); }
      h1 { font-size: 1.75rem; margin: 0 0 0.25rem; }
      .sub { color: var(--muted); margin: 0 0 1.5rem; }
      p { margin: 0 0 0.875rem; }
      .muted { color: var(--muted); font-size: 0.875rem; }
      .home { display: inline-block; margin-bottom: 1.5rem; color: var(--muted); }

    </style>
  </head>
  <body>
    <main>
      <a class="home" href="/">← Resuming</a>
      <h1>Feedback</h1>
      <p class="sub">Resuming by Cheerful Games, Inc.</p>
      
      <p>We’d love to hear how Resuming is working for you — what’s helpful, what’s confusing, and what you’d like next.</p>
      <p>Open <a href="/feedback">this page in the app</a> (or after signing in) to send a rating and a short note. You can also email <a href="mailto:resuming.me@gmail.com">resuming.me@gmail.com</a>.</p>
    
    </main>
  </body>
</html>

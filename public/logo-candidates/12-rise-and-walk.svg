<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Resuming mark: person rising into a walk">
  <rect width="128" height="128" rx="28" fill="#faf6f0"/>
  <!-- ground line: muted then coral -->
  <path d="M18 102 H52" fill="none" stroke="#c9b5a4" stroke-width="6" stroke-linecap="round"/>
  <path d="M72 102 H110" fill="none" stroke="#e07a5f" stroke-width="6" stroke-linecap="round"/>
  <!-- slumped figure (ink, left) -->
  <circle cx="38" cy="58" r="9" fill="#1a1614"/>
  <path
    d="M38 68 C28 78, 26 92, 30 100"
    fill="none"
    stroke="#1a1614"
    stroke-width="9"
    stroke-linecap="round"
  />
  <path
    d="M36 80 L48 88"
    fill="none"
    stroke="#1a1614"
    stroke-width="7"
    stroke-linecap="round"
  />
  <!-- rising into walk (coral, right) -->
  <circle cx="86" cy="34" r="9" fill="#e07a5f"/>
  <path
    d="M86 46 L80 72 L70 100"
    fill="none"
    stroke="#e07a5f"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M80 72 L96 84 L104 100"
    fill="none"
    stroke="#e07a5f"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M84 56 L100 48"
    fill="none"
    stroke="#e07a5f"
    stroke-width="7"
    stroke-linecap="round"
  />
</svg>

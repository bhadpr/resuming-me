<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Resuming mark: soft return arrow">
  <rect width="128" height="128" rx="28" fill="#faf6f0"/>
  <!-- U-turn path: pause, then continue forward -->
  <path
    d="M86 34 V58 C86 78, 70 90, 52 90 H38"
    fill="none"
    stroke="#e07a5f"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- arrowhead pointing forward (resume) -->
  <path d="M38 90 L54 76 L54 104 Z" fill="#e07a5f"/>
  <!-- small pause tick at the start -->
  <rect x="78" y="28" width="16" height="12" rx="4" fill="#1a1614"/>
</svg>

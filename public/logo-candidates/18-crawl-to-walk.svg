<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Resuming mark: crawling awake then walking">
  <rect width="128" height="128" rx="28" fill="#faf6f0"/>
  <!-- ground -->
  <path d="M14 108 H54" fill="none" stroke="#c9b5a4" stroke-width="6" stroke-linecap="round"/>
  <path d="M68 108 H114" fill="none" stroke="#e07a5f" stroke-width="6" stroke-linecap="round"/>
  <!-- crawling / trying to wake up (ink) -->
  <circle cx="42" cy="72" r="8" fill="#1a1614"/>
  <!-- torso low, parallel to ground -->
  <path d="M42 82 L28 96" fill="none" stroke="#1a1614" stroke-width="9" stroke-linecap="round"/>
  <!-- knees / back leg -->
  <path d="M28 96 L22 108" fill="none" stroke="#1a1614" stroke-width="8" stroke-linecap="round"/>
  <path d="M28 96 L38 108" fill="none" stroke="#1a1614" stroke-width="8" stroke-linecap="round"/>
  <!-- reaching arm forward (trying) -->
  <path d="M40 86 L52 100 L58 108" fill="none" stroke="#1a1614" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- head slightly lifted (waking) -->
  <path d="M42 72 L48 64" fill="none" stroke="#1a1614" stroke-width="5" stroke-linecap="round"/>
  <!-- walking (coral) -->
  <circle cx="90" cy="34" r="8" fill="#e07a5f"/>
  <path d="M90 46 L82 74 L70 108" fill="none" stroke="#e07a5f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M82 74 L98 86 L108 108" fill="none" stroke="#e07a5f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 56 L104 46" fill="none" stroke="#e07a5f" stroke-width="7" stroke-linecap="round"/>
</svg>

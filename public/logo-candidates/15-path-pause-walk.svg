  <!-- continuous path with pause gap -->
  <path d="M14 104 H46" fill="none" stroke="#c9b5a4" stroke-width="8" stroke-linecap="round"/>
  <rect x="52" y="92" width="4" height="24" rx="2" fill="#1a1614"/>
  <rect x="60" y="92" width="4" height="24" rx="2" fill="#1a1614"/>
  <path d="M72 104 H100" fill="none" stroke="#e07a5f" stroke-width="8" stroke-linecap="round"/>
  <path d="M98 90 L114 104 L98 118" fill="#e07a5f"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Resuming mark: seated then walking away">
  <rect width="128" height="128" rx="28" fill="#faf6f0"/>
  <!-- ground -->
  <path d="M16 104 H56" fill="none" stroke="#c9b5a4" stroke-width="6" stroke-linecap="round"/>
  <path d="M68 104 H112" fill="none" stroke="#e07a5f" stroke-width="6" stroke-linecap="round"/>
  <!-- seated slumped (ink) -->
  <circle cx="38" cy="52" r="8" fill="#1a1614"/>
  <path d="M38 62 C26 68, 24 86, 28 96" fill="none" stroke="#1a1614" stroke-width="9" stroke-linecap="round"/>
  <path d="M38 78 L54 78 L54 96" fill="none" stroke="#1a1614" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 70 L24 66" fill="none" stroke="#1a1614" stroke-width="7" stroke-linecap="round"/>
  <!-- walking away (coral) -->
  <circle cx="88" cy="34" r="8" fill="#e07a5f"/>
  <path d="M88 46 L84 72 L78 104" fill="none" stroke="#e07a5f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 72 L98 86 L106 104" fill="none" stroke="#e07a5f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 58 L102 50" fill="none" stroke="#e07a5f" stroke-width="7" stroke-linecap="round"/>
</svg>
